name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_PUBLIC_ONLY: '1'
      PORTFOLIO_BASE: /DGCportfolio
    steps:
      - uses: actions/checkout@v7
      - name: Check and build approved public website
        uses: withastro/action@v6
        with:
          node-version: '24'
          package-manager: npm
          build-cmd: npm run check && npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
